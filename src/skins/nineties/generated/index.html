<!doctype html><meta charset="utf-8"><title>nineties review</title><style>body{background:#181818;color:#eee;font:16px system-ui;margin:24px}button,select{font:inherit;padding:8px;margin:4px;background:#333;color:#fff;border:1px solid #888}header{position:sticky;top:0;background:#181818;padding:8px}#viewport{overflow:auto;max-height:78vh}img{display:block;image-rendering:pixelated;max-width:none}a{color:#fc8}.swatch{display:inline-block;width:24px;height:20px;margin:3px;border:1px solid #777}</style><h1>nineties · schema review</h1><p>Generated from one skin definition. Preview and test expectation are host renders, not screenshots. Select a view, toggle comparison, or inspect target pixels.</p><header><div id="buttons"></div><select id="zoom"><option value="fit">Fit width</option><option value="512">Target 512×384</option><option value="1448">Source-sized 1448×1086</option><option value="1024">2× target</option><option value="2048">4× target</option></select><button id="toggle">Toggle previous view</button><a id="full">Full image</a><div id="colors"></div></header><div id="viewport"><img id="art"></div><script>const views=[["1 \u00b7 Compiled preview", "preview.png"], ["2 \u00b7 Prepared backdrop", "backdrop.png"], ["3 \u00b7 Source artwork", "source-reference.png"], ["4 \u00b7 Test expectation", "test-paused.png"]];let current=0,previous=2;const art=document.getElementById('art'),zoom=document.getElementById('zoom');function size(){art.style.width=zoom.value==='fit'?'100%':zoom.value+'px'}function show(i){if(i!==current){previous=current;current=i}art.src=views[i][1];document.getElementById('full').href=art.src;size()}views.forEach((v,i)=>{let b=document.createElement('button');b.textContent=v[0];b.onclick=()=>show(i);document.getElementById('buttons').append(b)});zoom.onchange=size;document.getElementById('toggle').onclick=()=>show(previous);["#000000", "#00ff55", "#555555", "#aaaaaa", "#aaffaa", "#ff0000", "#ffff00", "#ffffff"].forEach(c=>{let s=document.createElement('span');s.className='swatch';s.title=c;s.style.background=c;document.getElementById('colors').append(s)});show(0)</script>
